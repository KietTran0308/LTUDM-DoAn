<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bếp Nhà Restaurant - Hệ thống</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="container">
     <div class="left-panel">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>

        <div class="logo-container">
            <div class="logo-icon">⌂</div>
            <div class="logo-text">
                <div class="brand-name">Bếp Nhà</div>
                <div class="brand-sub">RESTAURANT</div>
            </div>
        </div>

        <div class="center-content">
            <div class="badge">VẬN HÀNH NHÀ HÀNG, ĐƠN GIẢN HƠN</div>
            <h1 class="main-title">Mỗi đơn món,<br>một trải nghiệm<br><span class="text-orange">trọn vẹn.</span></h1>
            <p class="desc">Kết nối khách hàng, bếp và đội ngũ phục vụ trong một hệ<br>thống thời gian thực.</p>
        </div>
    </div>

    <!-- CỘT PHẢI (NƠI CHUYỂN ĐỔI FORM) -->
    <div class="right-panel" id="rightPanel">
        <!-- Mặc định chứa Form Đăng nhập -->
        <div class="form-container">
            <div class="title-wrapper">
                <h2 class="form-title">Chào mừng trở lại</h2>
            </div>
            <p class="form-subtitle">Đăng nhập để tiếp tục vào hệ thống Bếp Nhà</p>

            <hr class="separator">

            <div class="input-group">
                <label>Email hoặc số điện thoại</label>
                <input type="text" id="email" placeholder="name@bepnha.vn">
            </div>

            <div class="input-group">
                <label>Mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••">
                    <span class="toggle-password" onclick="togglePassword('password', this)"><img src="../../img/eye.png" alt="Alternate text" width="20" height="20"> ️</span>
                </div>
            </div>

            <div class="options">
                <label class="custom-checkbox">
                    <input type="checkbox" checked>
                    <span class="checkmark"></span>
                    Ghi nhớ đăng nhập
                </label>
                <a href="#" class="forgot-link">Quên mật khẩu?</a>
            </div>

            <button class="btn-primary" id="btnLogin">Đăng nhập</button>

            <div class="switch-form">
                Chưa có tài khoản? <a href="#" onclick="loadRegister(event)">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
