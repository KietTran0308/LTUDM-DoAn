<div class="form-container register-form">
    <div class="title-wrapper">
        <h2 class="form-title">Đăng ký tài khoản</h2>
    </div>
    <p class="form-subtitle">Tạo tài khoản để bắt đầu sử dụng các chức năng</p>

    <hr class="separator">

    <div class="input-group">
        <label>Họ và tên</label>
        <input type="text" id="fullname" placeholder="Nguyễn Minh Anh">
    </div>

    <div class="input-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="name@bepnha.vn">
    </div>

    <div class="input-group">
        <label>Số điện thoại</label>
        <input type="text" id="phone" placeholder="090 123 4567">
    </div>

    <div class="input-group">
        <label>Mật khẩu</label>
        <div class="password-wrapper">
            <input type="password" id="reg-password" placeholder="••••••••">
            <span class="toggle-password" onclick="togglePassword('reg-password', this)">👁️</span>
        </div>
    </div>

    <div class="input-group">
        <label>Xác nhận mật khẩu</label>
        <div class="password-wrapper">
            <input type="password" id="reg-confirm" placeholder="••••••••">
            <span class="toggle-password" onclick="togglePassword('reg-confirm', this)">👁️</span>
        </div>
    </div>

    <button class="btn-primary" id="btnRegister">Đăng ký</button>

    <div class="switch-form">
        Đã có tài khoản? <a href="#" onclick="loadLogin(event)">Đăng nhập</a>
    </div>
</div>
