<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Bếp Nhà</title>
    <link rel="stylesheet" href="Login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="div_left">
        <div class="logo">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17 8C17 5.24 14.76 3 12 3C9.24 3 7 5.24 7 8C5.34 8.36 4 9.9 4 11.76V15C4 16.1 4.9 17 6 17H18C19.1 17 20 16.1 20 15V11.76C20 9.9 18.66 8.36 17 8Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 17V18C9 19.66 10.34 21 12 21C13.66 21 15 19.66 15 18V17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="logo-text">
                <span class="brand-name">Bếp Nhà</span>
                <span class="brand-sub">RESTAURANT</span>
            </div>
        </div>

        <div class="left-content">
            <span class="badge">VẬN HÀNH NHÀ HÀNG, ĐƠN GIẢN HƠN</span>
            <h1>Mỗi đơn món,<br>một trải nghiệm<br><span class="highlight">trọn vẹn.</span></h1>
            <p>Kết nối khách hàng, bếp và đội ngũ phục vụ trong một hệ<br>thống thời gian thực.</p>
        </div>

        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
    </div>

    <div class="div_right">
        <div class="login-form-container">
            <h2>Chào mừng trở lại</h2>
            <p class="subtitle">Đăng nhập để tiếp tục vào hệ thống Bếp Nhà</p>

            <form action="#">
                <div class="form-group">
                    <label for="email">Email hoặc số điện thoại</label>
                    <input type="text" id="email" placeholder="name@bepnha.vn">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                        Ghi nhớ đăng nhập
                    </label>
                    <a href="#" class="forgot-password">Quên mật khẩu?</a>
                </div>

                <button type="button" class="btn-login">Đăng nhập</button>
            </form>

            <div class="register-link">
                Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
